name: Deploy Dashboard to GitHub Pages

# Triggers ONLY when docs/index.html (or this workflow) changes.
# Live progress updates come from raw.githubusercontent.com/main/docs/progress.json & worker.json
# without re-running Pages deployments on every worker commit.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"
      - id: deployment
        uses: actions/deploy-pages@v4

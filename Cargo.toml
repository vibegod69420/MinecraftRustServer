[workspace]
resolver = "2"
members = [
    "crates/mc-math",
    "crates/mc-nbt",
    "crates/mc-data",
    "crates/mc-protocol",
    "crates/mc-worldgen",
    "crates/mc-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
byteorder = "1.5"
flate2 = "1.0"
bytes = "1.7"
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
